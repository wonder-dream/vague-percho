name: Desktop package acceptance

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-and-verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: ubuntu-latest
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # PR builds otherwise skip signing entirely; our mac identity is explicitly ad-hoc ("-").
      CSC_FOR_PULL_REQUEST: "true"
      NODE_OPTIONS: "--max-old-space-size=4096"
      PERCHO_BUILD_RELEASE_TAG: ${{ inputs.release_tag }}
      PERCHO_BUILD_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci --replace-registry-host=always --registry=https://registry.npmjs.org
      - name: Verify Windows long-session rendering regressions
        if: runner.os == 'Windows'
        run: >-
          npm run test -w packages/desktop --
          src/renderer/src/components/chat/MetaGroup.lazy.test.tsx
          src/renderer/src/components/chat/use-sweep-highlight.test.tsx
          src/renderer/src/components/chat/turn-files.test.ts
          src/renderer/src/components/composer/Composer.run-state.test.tsx
          src/renderer/src/components/composer/use-composer-send.test.tsx
          src/renderer/src/components/diff/DiffSidebar.test.tsx
          src/renderer/src/components/ui/DeferredDetails.test.tsx
          src/renderer/src/stores/session-view.test.ts
          src/renderer/src/stores/ui-plugin-config-baseline.test.ts
          src/main/ui-plugins/manifest.test.ts
      - name: Verify release helpers and portable ZIP failure contracts
        if: runner.os == 'Windows'
        run: npm run test:release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: remote-runtime-*
          path: .local/runtime-release
          merge-multiple: true
      - name: Verify Windows installer hooks
        if: runner.os == 'Windows'
        run: node scripts/check-windows-update-diagnostics.mjs
      - name: Build desktop package and verify Windows filesystem contracts in parallel
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # These tests only use their own temporary directories; packaging never writes to them.
          # Native ACL checks launch PowerShell for each directory validation. These are
          # integration-test deadlines, not production worker/RPC timeouts.
          log="$PWD/.local/windows-media-filesystem.log"
          npm run test -w packages/backend -- file-operations.test.ts json-store-durable.test.ts json-store-rename.test.ts media-store.test.ts media-maintenance-preview.test.ts media-maintenance-transactions.test.ts --maxWorkers=2 --testTimeout=120000 --hookTimeout=30000 >"$log" 2>&1 &
          media_tests_pid=$!
          package_status=0
          npm run package:release -- --arch ${{ matrix.arch }} --output .local/release-output || package_status=$?
          media_tests_status=0
          wait "$media_tests_pid" || media_tests_status=$?
          echo "--- Windows media filesystem verification ---"
          cat "$log"
          if [ "$package_status" -ne 0 ]; then
            exit "$package_status"
          fi
          exit "$media_tests_status"
      - name: Build and verify desktop package
        if: runner.os != 'Linux' && runner.os != 'Windows'
        run: npm run package:release -- --arch ${{ matrix.arch }} --output .local/release-output
      - name: Build and verify Linux desktop under a virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run package:release -- --arch x64 --output .local/release-output
      - name: Verify Windows packaged media worker and recovery
        if: runner.os == 'Windows'
        run: node scripts/check-session-media-package.mjs --build-output .local/release-output
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && runner.os == 'Windows'
        with:
          name: media-worker-${{ runner.os }}
          path: |
            .local/tmp/session-media-package-check/**/report.json
            .local/tmp/session-media-package-check/**/native.log
          include-hidden-files: true
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ runner.os }}
          path: .local/release-output/artifacts/*
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: startup-logs-${{ runner.os }}
          path: |
            .local/tmp/local-storage-startup-check/
            .local/tmp/windows-update-hook-check/
            .local/tmp/session-media-package-check/
          include-hidden-files: true
