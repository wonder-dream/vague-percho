name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - id: plan
        run: node scripts/release-info.mjs --ci-beta

  runtime:
    needs: prepare
    uses: ./.github/workflows/remote-runtime.yml
    with:
      release_tag: ${{ needs.prepare.outputs.tag }}

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Validate the documented minimum, not only the latest Node 22.
          node-version: 22.19.0
          cache: npm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci --replace-registry-host=always --registry=https://registry.npmjs.org
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - name: Verify performance records and owned-process cleanup
        run: npm run test:perf

  desktop:
    needs: [prepare, runtime]
    uses: ./.github/workflows/desktop-package.yml
    with:
      release_tag: ${{ needs.prepare.outputs.tag }}

  release-bundle:
    needs: [prepare, desktop, check]
    runs-on: ubuntu-latest
    env:
      PERCHO_BUILD_RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      PERCHO_BUILD_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: remote-runtime-*
          path: .local/release-bundle
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: desktop-*
          path: .local/release-bundle
          merge-multiple: true
      - name: Verify complete Beta release without publishing
        run: node scripts/publish-release.mjs .local/release-bundle

  local-storage:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci --replace-registry-host=always --registry=https://registry.npmjs.org
      - name: Verify private storage on native filesystem and ACLs
        run: npm run test -w packages/backend -- test/local-agent-storage.test.ts test/local-agent-storage-sdk.test.ts
      - name: Test private storage startup decisions
        run: npm run test -w packages/desktop -- src/main/storage-startup-controller.test.ts
